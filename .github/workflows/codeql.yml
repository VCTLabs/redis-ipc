name: "CodeQL Advanced"

on:
  workflow_dispatch:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  #schedule:
    #- cron: '21 20 * * 5'

jobs:
  analyze:
    name: Analyze Cpp
    runs-on: ubuntu-22.04
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: autobuild
        - language: python
          build-mode: none
        - language: actions
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Environment
      run: |
        bash -c set

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Install dependencies
      if: matrix.language == 'cpp'
      run: |
        sudo apt-get -qq update
        sudo apt-get install -yqq software-properties-common redis-server
        sudo add-apt-repository -y -s ppa:nerdboy/embedded
        sudo add-apt-repository -y -s ppa:ubuntu-toolchain-r/ppa
        sudo apt-get -qq update
        sudo apt-get install -y libhiredis-dev autoconf automake
        sudo apt-get install -y libjson-c-dev
        sudo systemctl stop redis
        sudo apt-get install -y g++-11 g++-11-multilib
        echo "CC=gcc-11" >> $GITHUB_ENV
        echo "CXX=g++-11" >> $GITHUB_ENV

    - if: matrix.build-mode == 'manual'
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
