name: smoke

on:
  workflow_dispatch:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        include:
          - os: 'ubuntu-24.04'
            test_cmd: 'auto'
          - os: 'ubuntu-22.04'
            test_cmd: 'bionic'

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Environment
      run: |
        bash -c set

    # use gtest/gmock 1.10 from PPA in the following step
    - name: Deps plus PPA/msg bus
      run: |
        sudo apt-get -qq update
        sudo apt-get install -yqq redis-server autoconf automake lcov
        sudo apt-get install -yqq libjson-c-dev libhiredis-dev libgtest-dev libgmock-dev
        sudo systemctl stop redis

    - name: Add python requirements
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Test
      run: |
        tox -e "${{ matrix.test_cmd }}"

    - uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-22.04'
      with:
        name: coverage_redis-ipc
        path: ./coverage

  check:
    name: Collect metrics
    runs-on: ubuntu-22.04
    needs: [build]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: sarnold/cccc-action@855d440abe1a4229896f36b4d01d88decae0a1f2  # v1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        source_dirs: |
          src
          inc

    - uses: actions/upload-artifact@v4
      with:
        name: metrics_redis-ipc
        path: ./metrics
