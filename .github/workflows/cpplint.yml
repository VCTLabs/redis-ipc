name: cpplint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master, develop ]

jobs:
  cpplint:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Tox
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Run cpplint
      run: |
        tox -e lint
